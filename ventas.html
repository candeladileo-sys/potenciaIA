<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventas PotenciaIA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior con pestañas → una vista de trabajo por vez; la ficha se abre como panel lateral */
:root{
  --brand:#7c3aed; --brand-deep:#5b21b6; --brand-soft:#f1ecfe; --brand-line:#e4d9fb; --on-brand:#ffffff;
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eef0ec; --line:#e3e5e2;
  --fg:#1c1d22; --muted:#5b6066; --faint:#9aa0a6;
  --late:#c62828; --late-soft:#fdecea; --today:#b45309; --today-soft:#fef6e7; --ok:#15803d; --ok-soft:#e7f6ec;
  --c1:#7c3aed; --c2:#0d9488;
  --shadow:0 16px 48px rgba(28,29,34,.18);
  --f-display:"Syne","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#a78bfa; --brand-deep:#c4b5fd; --brand-soft:#2a2340; --brand-line:#3b3159; --on-brand:#16131f;
  --bg:#131316; --surface:#1c1c21; --surface-2:#25252b; --line:#303037;
  --fg:#ececf1; --muted:#a3a6ad; --faint:#70737a;
  --late:#ff8a80; --late-soft:#3a1f1e; --today:#f5b453; --today-soft:#372a15; --ok:#5fd38d; --ok-soft:#173023;
  --c1:#8b5cf6; --c2:#0fa596; --shadow:0 16px 48px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#a78bfa; --brand-deep:#c4b5fd; --brand-soft:#2a2340; --brand-line:#3b3159; --on-brand:#16131f;
  --bg:#131316; --surface:#1c1c21; --surface-2:#25252b; --line:#303037;
  --fg:#ececf1; --muted:#a3a6ad; --faint:#70737a;
  --late:#ff8a80; --late-soft:#3a1f1e; --today:#f5b453; --today-soft:#372a15; --ok:#5fd38d; --ok-soft:#173023;
  --c1:#8b5cf6; --c2:#0fa596; --shadow:0 16px 48px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.notice{background:var(--brand-soft);color:var(--brand-deep);font-size:13px;text-align:center;padding:7px 16px;font-weight:500}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(0,0,0,.05)}
.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 16px var(--f-display)}
.logo-name{font:700 17px var(--f-display);color:var(--brand)}
.logo-badge{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line);padding:3px 9px;border-radius:20px}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:10px}
nav.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:7px 13px;border-radius:7px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1{font:700 27px/1.2 var(--f-display);letter-spacing:-.01em;margin:30px 0 4px;text-wrap:balance}
h2{font:700 15px var(--f-display);margin:0;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stats.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat b{display:block;font:700 25px/1.2 var(--f-display);color:var(--brand);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:13px}
.stat.late b{color:var(--late)} .stat.today b{color:var(--today)} .stat.ok b{color:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.count{font:600 12px var(--f-body);background:var(--brand-soft);color:var(--brand);padding:1px 8px;border-radius:99px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:hover .rn{color:var(--brand)}
.rmain{min-width:0;flex:1}
.rn{font-weight:600}
.rs{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.today{background:var(--today-soft);color:var(--today)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.acc{background:var(--brand-soft);color:var(--brand)}
.empty{color:var(--muted);font-size:14px;padding:12px 0 2px;list-style:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.lane{background:var(--surface-2);border-radius:12px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.lane h3{font:600 12px var(--f-body);margin:2px 4px 4px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--brand)}
.card.late{box-shadow:inset 3px 0 0 var(--late)} .card.today{box-shadow:inset 3px 0 0 var(--today)}
.card .rn{font-size:14px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{margin-right:auto}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:112px;line-height:1.45}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.scrim{position:fixed;inset:0;background:rgba(18,14,30,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;align-items:flex-start;gap:12px}
.dh h2{font-size:22px}
.dh .x{margin-left:auto}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sec.warn{background:var(--today-soft);border-color:transparent;color:var(--today)}
.sec.warn h4{color:var(--today)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.outcomes button{text-align:left;justify-content:flex-start;white-space:normal;flex-direction:column;align-items:flex-start;gap:0}
.outcomes button small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.hist li{white-space:pre-wrap;overflow-wrap:anywhere}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--bg);border-radius:14px;z-index:31;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.nextline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.nextline label{flex:1;min-width:150px}
/* Login */
.login{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.login .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.login .logo-icon{width:52px;height:52px;font-size:24px;border-radius:13px}
.login h1{margin:4px 0 0;font-size:24px}
.err{color:var(--late);font-size:14px}
/* Métricas */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.mgrid .wide{grid-column:1/-1}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px;cursor:default;padding:2px 0}
.hb .lab{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{height:22px;display:flex;align-items:center}
.hb .fill{height:16px;background:var(--c1);border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hb:hover .fill{filter:brightness(1.12)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{margin-top:6px}
.chart svg{display:block;max-width:100%;overflow:visible}
.chart text{fill:var(--muted);font:12px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--brand-soft);fill-opacity:.55}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;max-width:240px}
.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
details.data{margin-top:10px;font-size:13px;color:var(--muted)}
details.data summary{cursor:pointer}
details.data table{margin-top:8px;font-size:13px}
.spin{display:grid;place-items:center;min-height:40vh;color:var(--muted)}
/* Hoy */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:var(--brand)} .tile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tile b{font:700 26px/1.2 var(--f-display);color:var(--brand);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile em{font-style:normal;font-size:13px;font-weight:600;color:var(--brand);margin-top:4px}
.tile.main{background:var(--brand);border-color:var(--brand)}
.tile.main b,.tile.main span,.tile.main em{color:var(--on-brand)}
.tile.main:hover{background:var(--brand-deep)}
.tile.late b{color:var(--late)} .tile.ok b{color:var(--ok)}
.weekbar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.weekbar h2{font-size:18px;margin-right:auto}
.wk{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.wk .col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wk .col.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.wk .col.we{background:var(--surface-2)}
.wk .dh2{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.wk .dh2 span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wk .dh2 b{font:700 22px var(--f-display)}
.wk .col.today .dh2 span,.wk .col.today .dh2 b{color:var(--brand)}
.wk .free{color:var(--faint);font-size:13px}
.ev small{display:block;font-weight:400;opacity:.8;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.pend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.pend button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.pend button:hover{border-color:var(--brand)}
.pend button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pend b{font:700 22px var(--f-display);color:var(--fg)}
.pend span{color:var(--muted);font-size:13px}
.pend em{font-style:normal;color:var(--brand);font-size:13px;font-weight:600;margin-top:4px}
/* Agenda */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.calbar h2{font-size:20px;margin-right:auto}
input[type=checkbox]{accent-color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .h{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px}
.cal .d{background:var(--surface);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .d.out{background:var(--surface-2)} .cal .d.out .num{color:var(--faint)}
.cal .num{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .d.today .num{background:var(--brand);color:var(--on-brand)}
.ev{all:unset;box-sizing:border-box;cursor:pointer;font-size:12px;font-weight:500;padding:3px 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev:hover{filter:brightness(.96)} .ev:focus-visible{outline:2px solid var(--brand)}
.ev.late{background:var(--late-soft);color:var(--late)} .ev.today{background:var(--today-soft);color:var(--today)} .ev.meet{background:var(--brand);color:var(--on-brand)}
.ev.more{background:none;color:var(--muted);padding-left:2px}
.callist{display:none;flex-direction:column;gap:14px}
/* LinkedIn */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.drop{border:1.5px dashed var(--brand-line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;background:var(--brand-soft)}
.drop input{margin-top:10px;background:none;border:0;padding:0}
.lirow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.lirow input[type=checkbox]{width:18px;height:18px;margin-top:3px}
@media (max-width:900px){.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .stats,.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.mgrid{grid-template-columns:minmax(0,1fr)}
  nav.tabs{order:3;width:100%} nav.tabs button{flex:1;padding:7px 4px;font-size:13px}
  .outcomes{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .pend{grid-template-columns:minmax(0,1fr)}
  .cal{display:none} .callist{display:flex}
  .logo-badge{display:none}
  .hb{grid-template-columns:96px minmax(0,1fr) 40px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="notice" id="notice" hidden></div>
<header class="top"><div class="wrap topin">
  <div class="logo"><div class="logo-icon">P</div><div class="logo-name">PotenciaIA</div><span class="logo-badge">Ventas</span></div>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-view="hoy" aria-selected="true">Hoy</button>
    <button role="tab" data-view="agenda" aria-selected="false">Agenda</button>
    <button role="tab" data-view="potenciales" aria-selected="false">Outbound</button>
    <button role="tab" data-view="ventas" aria-selected="false">Ventas</button>
    <button role="tab" data-view="metricas" aria-selected="false">Métricas</button>
  </nav>
  <div class="btns" id="actions" hidden>
    <button class="btn ghost sm" data-act="reload" id="btnReload" hidden>Actualizar</button>
    <button class="btn" data-act="linkedin">Desde LinkedIn</button>
    <button class="btn primary" data-act="nuevo">+ Nuevo contacto</button>
  </div>
</div></header>
<main class="wrap" id="view"><div class="spin">Cargando…</div></main>
<div id="layer"></div>
<div class="tip" id="tip" hidden></div>

<script>
/* ===================== CONFIGURACIÓN ===================== */
const CONFIG = {
  // Código que da Google Cloud (Google Auth Platform → Clients). Termina en .apps.googleusercontent.com
  CLIENT_ID: "748478455182-mnnu4dplvvl8mhkbqgblu9nqgcm8m2rs.apps.googleusercontent.com",
  // Planilla "Ventas PotenciaIA"
  SHEET_ID: "1MJ6lRXrJRnMrNeAXuvO-y2_8gIxdR0fooCZYUoqBRVk",

  // Mismo Worker de Cloudflare que usa el dashboard (lee las capturas de LinkedIn con IA)
  PROXY_URL: "https://potenciaia-proxy.dileocande.workers.dev",
  PROXY_SECRET: "pASCHdB6WZOwoIRIHDwmxKweF-u2R1eLNK0p3fHP9JA",
  MODELO: "claude-sonnet-4-5-20250929",
};
const SCOPE = "https://www.googleapis.com/auth/spreadsheets";

/* ===================== UTILIDADES ===================== */
const DAY = 864e5;
const today = new Date(); today.setHours(0,0,0,0);
const addDays = n => new Date(today.getTime() + n*DAY);
const ETAPAS = ["Por contactar","Contactado","Presentado","Reunión","Prueba gratis","Compró","Perdido"];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const money = n => n == null ? "—" : new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
const moneyShort = n => n >= 1e6 ? "$" + (n/1e6).toFixed(1).replace(".",",") + " M" : n >= 1e3 ? "$" + Math.round(n/1e3) + " mil" : "$" + Math.round(n);
const fd = x => x ? x.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) : "—";
const fdl = x => x ? x.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
const diff = x => Math.round((x - today) / DAY);
const iso = x => x ? `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}` : "";
const fromIso = s => { if(!s) return null; const [a,b,c] = s.split("-").map(Number); return new Date(a,b-1,c); };
const first = s => String(s || "").trim().split(/\s+/)[0] || "";
const capWord = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function toDate(v){
  if (v === "" || v == null) return null;
  if (typeof v === "number"){ const d = new Date(1899,11,30); d.setDate(d.getDate() + Math.floor(v)); return d; }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/))) return new Date(m[3].length===2 ? 2000 + +m[3] : +m[3], +m[2]-1, +m[1]);
  return null;
}
function toNum(v){
  if (v === "" || v == null) return null;
  if (typeof v === "number") return v;
  const s = String(v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
const toTel = v => String(v ?? "").replace(/\D/g,"");
const isSi = v => norm(v).startsWith("s");
const isPrueba = v => norm(v.tipo).startsWith("prueba");
const ventasReales = () => S.V.filter(v => !isPrueba(v));
const aCobrarL = () => S.V.filter(v => !v.cobro && !isPrueba(v));

/* Columnas: se buscan por el título, así no importa el orden en la planilla */
const C_DEF = [["id","id"],["empresa","empresa"],["persona","contacto"],["cargo","cargo"],["telefono","tel"],["mail","email"],["linkedin","li"],["etapa","etapa"],["origen","origen"],["canal","canal"],["veces","veces"],["ultimo","ult"],["proximo","prox"],["notas","notas"],["revisar","revisar"]];
const V_DEF = [["id","id"],["fecha de venta","fecha"],["empresa","empresa"],["creditos","creditos"],["monto","vendido"],["cobro","cobro"],["fecha de cobro","fcobro"],["neto","neto"],["post","iibb"],["notas","notas"],["tipo","tipo"]];
const C_TYPE = {id:"num",veces:"num",ult:"date",prox:"date",tel:"tel"};
const V_TYPE = {id:"num",fecha:"date",fcobro:"date",creditos:"num",vendido:"num",neto:"num",iibb:"num",cobro:"sino"};
function mapCols(head, defs){
  const out = {}, used = new Set();
  defs.forEach(([key, field]) => {
    const i = head.findIndex((h, j) => !used.has(j) && norm(h).startsWith(key));
    if (i >= 0){ out[field] = i; used.add(i); }
  });
  return out;
}
function parseRows(rows, cols, types){
  return rows.map((r, k) => {
    const o = { _row: k + 2 };
    for (const f in cols){
      const v = r[cols[f]], t = types[f];
      o[f] = t === "num" ? toNum(v) : t === "date" ? toDate(v) : t === "tel" ? toTel(v) : t === "sino" ? isSi(v) : String(v ?? "").trim();
    }
    return o;
  }).filter(o => Object.keys(o).some(k => k !== "_row" && o[k] !== "" && o[k] != null && o[k] !== false));
}
function cellValue(v, t){
  if (v == null || v === "") return "";
  if (t === "date") return iso(v);
  if (t === "tel") return v ? "'" + v : "";
  if (t === "sino") return v ? "Sí" : "No";
  return v;
}
const colLetter = i => { let s = ""; i++; while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
const quoteSheet = n => "'" + n.replace(/'/g,"''") + "'";

/* ===================== GOOGLE SHEETS ===================== */
async function api(path, opts = {}){
  if (!S.token || Date.now() > S.exp) throw { code: 401 };
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}${path}`, {
    ...opts, headers: { Authorization: "Bearer " + S.token, "Content-Type": "application/json" }
  });
  if (!r.ok) throw { code: r.status, msg: await r.text() };
  return r.json();
}
async function loadLive(silent){
  if (!silent) $("#view").innerHTML = `<div class="spin">Leyendo la planilla…</div>`;
  try{
    const q = [CONFIG.HOJA_CONTACTOS, CONFIG.HOJA_VENTAS].map(n => "ranges=" + encodeURIComponent(quoteSheet(n))).join("&");
    const res = await api(`/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
    const [c, v] = res.valueRanges.map(x => x.values || []);
    S.cCols = mapCols(c[0] || [], C_DEF); S.vCols = mapCols(v[0] || [], V_DEF);
    S.cWidth = (c[0] || []).length; S.vWidth = (v[0] || []).length;
    if (S.vCols.tipo == null && v[0]){
      await api(`/values/${encodeURIComponent(quoteSheet(CONFIG.HOJA_VENTAS) + "!" + colLetter(S.vWidth) + "1")}?valueInputOption=RAW`, { method: "PUT", body: JSON.stringify({ values: [["Tipo"]] }) });
      S.vCols.tipo = S.vWidth; S.vWidth++;
    }
    S.P = parseRows(c.slice(1), S.cCols, C_TYPE); S.V = parseRows(v.slice(1), S.vCols, V_TYPE);
    S.P.forEach(p => { if (p.id == null) p.id = 100000 + p._row; });
    S.V.forEach(x => { if (x.id == null) x.id = 100000 + x._row; });
    showApp(); render(); if (S.openId && get(S.openId)) openP(S.openId);
  }catch(e){ handleErr(e); }
}
function handleErr(e){
  if (e && e.code === 401){ S.token = null; try{ sessionStorage.removeItem("pv_tok"); }catch(_){} showLogin("Tu sesión venció. Volvé a entrar."); return; }
  if (e && (e.code === 403 || e.code === 404)){ showLogin("Tu cuenta de Google no tiene acceso a la planilla “Ventas PotenciaIA”. Pedí que te la compartan como editora y volvé a entrar."); return; }
  console.error(e); toast("No se pudo guardar. Revisá la conexión y tocá Actualizar.");
}
/* Guarda solo las celdas que cambian, para no pisar lo que otra persona (o Claude) haya cargado */
const saveFields = (kind, rec, changes) => saveMany(kind, [[rec, changes]]);
async function saveMany(kind, list){
  list.forEach(([rec, ch]) => Object.assign(rec, ch));
  if (S.mode !== "live") return;
  const cols = kind === "c" ? S.cCols : S.vCols, types = kind === "c" ? C_TYPE : V_TYPE;
  const hoja = kind === "c" ? CONFIG.HOJA_CONTACTOS : CONFIG.HOJA_VENTAS;
  const data = list.flatMap(([rec, ch]) => rec._row ? Object.keys(ch).filter(f => cols[f] != null).map(f => ({
    range: `${quoteSheet(hoja)}!${colLetter(cols[f])}${rec._row}`, values: [[cellValue(ch[f], types[f])]]
  })) : []);
  if (!data.length) return;
  try{ await api(`/values:batchUpdate`, { method: "POST", body: JSON.stringify({ valueInputOption: "USER_ENTERED", data }) }); }
  catch(e){ handleErr(e); }
}
async function appendRows(recs){
  let id = Math.max(0, ...S.P.map(x => x.id < 100000 ? x.id : 0));
  recs.forEach(r => r.id = ++id);
  if (S.mode !== "live"){ recs.forEach(r => { r._row = 0; S.P.push(r); }); return true; }
  const rows = recs.map(rec => { const row = Array(S.cWidth).fill(""); for (const f in S.cCols) row[S.cCols[f]] = cellValue(rec[f], C_TYPE[f]); return row; });
  try{ await api(`/values/${encodeURIComponent(quoteSheet(CONFIG.HOJA_CONTACTOS) + "!A1")}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`, { method: "POST", body: JSON.stringify({ values: rows }) }); await loadLive(true); return true; }
  catch(e){ handleErr(e); return false; }
}
async function appendRow(kind, rec){
  const list = kind === "c" ? S.P : S.V;
  rec.id = Math.max(0, ...list.map(x => x.id < 100000 ? x.id : 0)) + 1;
  if (S.mode !== "live"){ rec._row = 0; list.push(rec); return rec; }
  const cols = kind === "c" ? S.cCols : S.vCols, types = kind === "c" ? C_TYPE : V_TYPE;
  const width = kind === "c" ? S.cWidth : S.vWidth, hoja = kind === "c" ? CONFIG.HOJA_CONTACTOS : CONFIG.HOJA_VENTAS;
  const row = Array(width).fill("");
  for (const f in cols) row[cols[f]] = cellValue(rec[f], types[f]);
  try{
    const r = await api(`/values/${encodeURIComponent(quoteSheet(hoja) + "!A1")}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`, { method: "POST", body: JSON.stringify({ values: [row] }) });
    const m = (r.updates && r.updates.updatedRange || "").match(/!(?:[A-Z]+)(\d+)/);
    rec._row = m ? +m[1] : 0; list.push(rec); return rec;
  }catch(e){ handleErr(e); return null; }
}

/* ===================== LÓGICA DE SEGUIMIENTO ===================== */
function estado(p){
  const activa = ACTIVAS.includes(p.etapa) || !p.etapa;
  if (!activa && p.etapa !== "Compró") return null;
  if (!p.prox) return esPotencial(p) ? { c:"", t:"Outbound" } : activa ? { c:"", t:"Sin próximo paso" } : null;
  const n = diff(p.prox);
  if (n < 0) return { c:"late", t:`Atrasado ${-n} día${n === -1 ? "" : "s"}` };
  if (n === 0) return { c:"today", t:"Hoy" };
  if (n === 1) return { c:"acc", t:"Mañana" };
  return { c:"acc", t:`En ${n} días` };
}
function ultTxt(p){ if (!p.ult) return "Sin contacto registrado"; const n = -diff(p.ult); return n <= 0 ? "Último contacto: hoy" : `Último contacto: hace ${n} día${n === 1 ? "" : "s"}`; }
const proxPaso = p => { const l = String(p.notas || "").split(/\n+/).find(x => /Próximo paso:/i.test(x)); return l ? l.replace(/^.*Próximo paso:\s*/i, "") : ""; };
const outlookEvent = (subject, dayIso, hora, body) => `https://outlook.office.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject=${encodeURIComponent(subject)}&startdt=${dayIso}T${hora}:00&enddt=${dayIso}T${addMin(hora, 30)}:00&body=${encodeURIComponent(body.replace(/\n/g, "<br>"))}`;
const addMin = (h, m) => { const [a, b] = h.split(":").map(Number), t = a * 60 + b + m; return `${String(Math.floor(t / 60) % 24).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const outlookMail = (to, msg) => `https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(to)}&subject=${encodeURIComponent("PotenciaIA")}&body=${encodeURIComponent(msg)}`;
const fichaTxt = (p, msg) => "Empresa: " + p.empresa + "\nContacto: " + p.contacto + "\nTel: " + (p.tel ? "+" + p.tel : "—") + "\nMail: " + (p.email || "—") + (msg ? "\n\nMensaje sugerido:\n" + msg : "");
const ACCION = { "Reunión": "Confirmar día y hora de la reunión", "Prueba gratis": "Preguntar cómo les fue con la prueba y ofrecer la devolución de resultados", "Presentado": "Hacer seguimiento de la presentación y ofrecer la prueba gratis", "Contactado": "Volver a escribir y proponer una llamada corta", "Por contactar": "Primer contacto", "Compró": "Preguntar cómo vienen y ofrecer más créditos" };
const PRIO = ["Reunión", "Prueba gratis", "Presentado", "Contactado", "Por contactar", "Compró"];
const nextBiz = d => { const x = new Date(d); do { x.setDate(x.getDate() + 1); } while (x.getDay() === 0 || x.getDay() === 6); return x; };
function planPasos(){
  const L = S.P.filter(p => !p.prox && ((ACTIVAS.includes(p.etapa) && !esPotencial(p)) || p.etapa === "Compró"))
    .sort((a, b) => PRIO.indexOf(a.etapa || "Por contactar") - PRIO.indexOf(b.etapa || "Por contactar"));
  let day = nextBiz(today), n = 0;
  return L.map(p => {
    if (p.etapa === "Compró"){ let f = addDays(14); while (f.getDay() === 0 || f.getDay() === 6) f = new Date(f.getTime() + DAY); return { p, fecha: f, acc: ACCION["Compró"] }; }
    if (n === 4){ day = nextBiz(day); n = 0; } n++;
    return { p, fecha: new Date(day), acc: ACCION[p.etapa || "Por contactar"] || "Hacer seguimiento" };
  });
}
const POT = "Por contactar";
const esPotencial = p => !p.etapa || p.etapa === POT;
const sinPaso = () => S.P.filter(p => ACTIVAS.includes(p.etapa) && !esPotencial(p) && !p.prox);

function weekStrip(){
  const off = S.wk || 0, base = new Date(today.getTime() + off * 7 * DAY);
  let html = "";

    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i), k = iso(d);
    let L = enSeguimiento().filter(p => p.prox && iso(p.prox) === k);
    if (k === iso(today)) L = [...enSeguimiento().filter(p => p.prox && diff(p.prox) < 0).sort((a,b) => a.prox - b.prox), ...L];
    const we = d.getDay() === 0 || d.getDay() === 6;
    html += `<div class="col${k === iso(today) ? " today" : ""}${we ? " we" : ""}"><div class="dh2"><span>${k === iso(today) ? "Hoy" : d.toLocaleDateString("es-AR",{weekday:"short"}).replace(".","")}</span><b>${d.getDate()}</b></div>${L.length ? L.map(evChipBig).join("") : `<span class="free">Libre</span>`}</div>`;

}

function vAgenda(){

const mesKey = d => d ? capWord(d.toLocaleDateString("es-AR",{month:"long",year:"numeric"})) : "Sin fecha";

function hbars(items, tipFn){

}
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chartMeses(Wpx){
  const SV = ventasReales(); const months = []; for (let k = 5; k >= 0; k--){ const d = new Date(today.getFullYear(), today.getMonth() - k, 1); months.push(d); }
  const data = months.map(d => { const L = SV.filter(v => v.fecha && v.fecha.getFullYear() === d.getFullYear() && v.fecha.getMonth() === d.getMonth());
    return { d, lab: capWord(d.toLocaleDateString("es-AR",{month:"short"}).replace(".","")), vend: L.reduce((s,v) => s + (v.vendido || 0), 0), cob: L.filter(v => v.cobro).reduce((s,v) => s + (v.neto || v.vendido || 0), 0) }; });
  const W = Math.max(300, Wpx || 640), H = 250, pl = 64, pr = 8, pt = 10, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const top = niceMax(Math.max(...data.map(x => Math.max(x.vend, x.cob))));
  const y = v => pt + ih - v / top * ih, gw = iw / data.length, bw = Math.min(26, (gw - 18) / 2);
  const bar = (x, v, cls) => { if (!v) return ""; const h = Math.max(2, ih - (y(v) - pt)), r = Math.min(4, h / 2), y0 = pt + ih; return `<path fill="var(${cls})" d="M${x},${y0} V${y0 - h + r} Q${x},${y0 - h} ${x + r},${y0 - h} H${x + bw - r} Q${x + bw},${y0 - h} ${x + bw},${y0 - h + r} V${y0} Z"/>`; };
  let g = ""; for (let i = 0; i <= 4; i++){ const v = top / 4 * i; g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v ? moneyShort(v) : "$0"}</text>`; }
  const bars = data.map((x, i) => { const cx = pl + gw * i + gw / 2; return `<rect class="hit" x="${pl + gw * i + 2}" y="${pt}" width="${gw - 4}" height="${ih}" rx="6" data-tip="${esc(`<b>${capWord(x.d.toLocaleDateString("es-AR",{month:"long",year:"numeric"}))}</b><i style='background:var(--c1)'></i>Vendido: ${money(x.vend)}<br><i style='background:var(--c2)'></i>Cobrado: ${money(x.cob)}`)}" data-html="1"/>${bar(cx - bw - 1, x.vend, "--c1")}${bar(cx + 1, x.cob, "--c2")}<text x="${cx}" y="${H - 8}" text-anchor="middle">${x.lab}</text>`; }).join("");
  const table = `<details class="data"><summary>Ver los números</summary><div class="tablewrap"><table><thead><tr><th>Mes</th><th class="n">Vendido</th><th class="n">Cobrado</th></tr></thead><tbody>${data.map(x => `<tr><td>${x.lab}</td><td class="n">${money(x.vend)}</td><td class="n">${money(x.cob)}</td></tr>`).join("")}</tbody></table></div></details>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${bars}</svg>${table}`;
}
function vMetricas(){
  const total = S.P.length, clientes = S.P.filter(p => p.etapa === "Compró").length;

function shrink(file){
  return new Promise((ok, bad) => { const fr = new FileReader(); fr.onerror = bad; fr.onload = () => { const im = new Image(); im.onerror = bad; im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .85)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}

  <label>LinkedIn (link del perfil)<input id="n-li" placeholder="https://www.linkedin.com/in/..." value="${esc(p.li)}"></label>
  ${n ? "" : `<label>Etapa<select id="n-et">${ETAPAS.map(x => `<option value="${x}" ${x === (p.etapa || POT) ? "selected" : ""}>${x === POT ? "Por contactar (outbound)" : x}</option>`).join("")}</select></label>`}
  <div class="grid2"><label>¿De dónde viene?<select id="n-ori">${["","LinkedIn","Recomendación","Evento","Base propia","Otro"].map(o => `<option ${o === (p.origen || (n ? "LinkedIn" : "")) ? "selected" : ""} value="${o}">${o || "—"}</option>`).join("")}</select></label><label>Canal<select id="n-can">${["","Mail","WhatsApp","LinkedIn","Mail + WhatsApp","Teléfono"].map(o => `<option ${o === (p.canal || "") ? "selected" : ""} value="${o}">${o || "—"}</option>`).join("")}</select></label></div>
  ${n ? `<div class="grid2"><label>Nota inicial<input id="n-not" placeholder="Ej: comentó mi publicación sobre liderazgo"></label><label>¿Cuándo le escribís? (opcional)<input type="date" id="n-prox"></label></div><p class="hint" style="margin:0">Sin fecha, queda en Outbound.</p>` : p.revisar ? `<div class="sec warn"><h4>Para revisar</h4><div>${esc(p.revisar)}</div><label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="n-ok" style="width:auto" checked> Ya está corregido (sale de “Datos para completar”)</label></div>` : ""}
  <div class="btns" style="justify-content:flex-end"><button type="button" class="btn" data-act="closemodal">Cancelar</button><button class="btn primary" type="submit">${n ? "Crear y abrir ficha" : "Guardar"}</button></div></form>`;
}
function modalVenta(v, tipo){
  v = v || { empresa:"", fecha:today, creditos:"", vendido:"", cobro:false, fcobro:null, neto:"", iibb:"", notas:"", tipo: tipo || "Venta" };
  const pr = isPrueba(v);
  return `<div class="scrim" data-act="closemodal" style="z-index:30"></div><form class="modal" id="fventa" data-id="${v.id || ""}"><h2>${v.id ? "Editar" : "Registrar"} ${pr ? "prueba" : "venta"}</h2>
  <label>Tipo<select id="v-tipo"><option ${!pr ? "selected" : ""}>Venta</option><option ${pr ? "selected" : ""}>Prueba</option></select></label>
  <label>Empresa<input id="v-emp" required value="${esc(v.empresa)}" list="emps"></label><datalist id="emps">${[...new Set(S.P.map(p => p.empresa))].map(e => `<option value="${esc(e)}">`).join("")}</datalist>
  <div class="grid2"><label><span id="v-flab">${pr ? "Fecha en que le diste la prueba" : "Fecha de venta"}</span><input type="date" id="v-fecha" required value="${iso(v.fecha)}"></label><label>${pr ? "Créditos de prueba" : "Créditos"}<input type="number" min="0" id="v-cred" value="${v.creditos ?? ""}"></label></div>
  <div id="v-money" style="display:flex;flex-direction:column;gap:12px" ${pr ? "hidden" : ""}>
  <label>Monto vendido ($)<input type="number" min="0" id="v-vend" value="${v.vendido ?? ""}"></label>
  <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="v-cobro" style="width:auto" ${v.cobro ? "checked" : ""}> Ya cobró</label>
  <div class="grid2"><label>Fecha de cobro<input type="date" id="v-fcobro" value="${iso(v.fcobro)}"></label><label>Neto cobrado ($)<input type="number" min="0" id="v-neto" value="${v.neto ?? ""}"></label></div>
  <label>Post IIBB ($)<input type="number" min="0" id="v-iibb" value="${v.iibb ?? ""}"></label></div>
  <label>Notas<input id="v-not" value="${esc(v.notas)}" placeholder="${pr ? "Ej: para 3 mandos medios" : ""}"></label>
  <div class="btns" style="justify-content:flex-end"><button type="button" class="btn" data-act="closemodal">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`;
}
function bindVenta(){ const t = $("#v-tipo"); if (t) t.onchange = () => { const pr = t.value === "Prueba"; $("#v-money").hidden = pr; $("#v-flab").textContent = pr ? "Fecha en que le diste la prueba" : "Fecha de venta"; }; }

/* ===================== RENDER Y EVENTOS ===================== */
function render(){
  const v = S.view;
  $("#view").innerHTML = v === "hoy" ? vHoy() : v === "agenda" ? vAgenda() : v === "potenciales" ? vPotenciales() : v === "ventas" ? vVentas() : vMetricas();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  const m = $("#mes"); if (m) m.onchange = () => { S.mes = m.value; render(); };
  document.querySelectorAll("select.pot-et").forEach(sel => sel.onchange = async () => {
    const q = get(+sel.dataset.pid), et = sel.value; if (!q) return;
    if (et === "Reunión"){ $("#layer").insertAdjacentHTML("beforeend", modalReunion(q)); return; }
    if (et === "Compró" || et === "Prueba gratis"){ await saveFields("c", q, { etapa: et, ult: today, notas: logLine(q, `Pasó a ${et}`) }); refresh(`${q.empresa} pasó a ${et}`); $("#layer").insertAdjacentHTML("beforeend", modalVenta({ empresa: q.empresa, fecha: today, creditos: "", vendido: et === "Compró" ? "" : null, cobro: false, tipo: et === "Compró" ? "Venta" : "Prueba" })); bindVenta(); return; }
    const ch = { etapa: et, notas: logLine(q, `Pasó a ${et}`) };
    if (et !== POT && !q.prox && et !== "Perdido"){ ch.prox = nextBiz(today); ch.notas = logLine(q, `Pasó a ${et}. Próximo paso: ${ACCION[et] || "Hacer seguimiento"}`); }
    await saveFields("c", q, ch); refresh(et === POT ? "Guardado" : `${q.contacto || q.empresa} pasó a ${et}${ch.prox ? ` · seguimiento el ${fd(ch.prox)}` : ""}`);
  });
  const qp = $("#qpot"); if (qp) qp.oninput = () => { S.qpot = qp.value; const pos = qp.selectionStart; render(); const n = $("#qpot"); n.focus(); n.setSelectionRange(pos, pos); };
  drawCharts();
}
function drawCharts(){ const c = $("#chartMeses"); if (c) c.innerHTML = chartMeses(c.clientWidth); }
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(drawCharts, 150); });
function openP(id){
  S.openId = id; const p = get(id); if (!p) return;
  const keepModal = [...document.querySelectorAll("#layer .modal, #layer .scrim[style]")];
  $("#layer").innerHTML = drawer(p); keepModal.forEach(el => $("#layer").appendChild(el));
}
const logLine = (p, t) => `${fd(today)}: ${t}` + (p.notas ? "\n" + p.notas : "");
function refresh(msg){ render(); if (S.openId && get(S.openId)) openP(S.openId); if (msg) toast(msg); }
function closeModal(){ document.querySelectorAll("#layer .modal, #layer .scrim[style]").forEach(e => e.remove()); }
function toast(t){ document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
async function copy(text, ok){ try{ await navigator.clipboard.writeText(text); toast(ok); }catch(e){ const m = $("#msg"); if (m){ m.focus(); m.select(); } toast("Seleccioné el texto: copialo con Ctrl+C"); } }

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-view],[data-open],[data-act],[data-out],[data-venta]"); if (!t || t.getAttribute("aria-disabled") === "true") return;
  if (t.dataset.view){ S.view = t.dataset.view; S.openId = null; $("#layer").innerHTML = ""; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.open){ if (t.closest(".modal")) closeModal(); openP(+t.dataset.open); return; }
  if (t.dataset.venta){ if (t.closest(".modal")) closeModal(); $("#layer").insertAdjacentHTML("beforeend", modalVenta(S.V.find(v => v.id === +t.dataset.venta))); bindVenta(); return; }
  const a = t.dataset.act, p = S.openId && get(S.openId);
  if (a === "login"){ tokenClient && tokenClient.requestAccessToken({ prompt: "" }); return; }
  if (a === "reload"){ loadLive(true).then(() => toast("Datos actualizados")); return; }
  if (t.dataset.out && p){
    const o = OUT.find(x => x[0] === t.dataset.out); if (!o) return;
    if (o[0] === "otro"){ $("#layer").insertAdjacentHTML("beforeend", modalOtro(p)); const c = $("#o-cuando"); c.onchange = () => { $("#o-flab").hidden = c.value !== "fecha"; }; $("#o-txt").focus(); return; }
    if (o[0] === "reunion"){ $("#layer").insertAdjacentHTML("beforeend", modalReunion(p)); return; }
    const ch = { ult: today, veces: (p.veces || 0) + 1, prox: o[4] == null ? null : addDays(o[4]), notas: logLine(p, o[1]) };
    if (o[3]) ch.etapa = o[3];
    await saveFields("c", p, ch);
    refresh(o[4] == null ? "Guardado" : `Guardado. Te lo recuerdo el ${fd(ch.prox)}`);
    if (o[0] === "compro"){ $("#layer").insertAdjacentHTML("beforeend", modalVenta({ empresa: p.empresa, fecha: today, creditos: "", vendido: "", cobro: false, tipo: "Venta" })); bindVenta(); }
    if (o[0] === "prueba"){ $("#layer").insertAdjacentHTML("beforeend", modalVenta({ empresa: p.empresa, fecha: today, creditos: "", vendido: null, cobro: false, tipo: "Prueba" })); bindVenta(); }
    return;
  }
  if (a === "close"){ S.openId = null; $("#layer").innerHTML = ""; return; }
  if (a === "closemodal"){ closeModal(); if (S.view === "potenciales") render(); return; }
  if (a === "nuevo"){ $("#layer").insertAdjacentHTML("beforeend", modalContacto()); $("#n-emp").focus(); return; }
  if (a === "editar" && p){ $("#layer").insertAdjacentHTML("beforeend", modalContacto(p)); return; }
  if (a === "venta" || a === "prueba"){ $("#layer").insertAdjacentHTML("beforeend", modalVenta(null, a === "prueba" ? "Prueba" : "Venta")); bindVenta(); return; }
  if (a === "vfiltro"){ S.vfiltro = t.dataset.f; S.mes = "todos"; render(); return; }
  if (a === "copy"){ copy($("#msg").value, "Mensaje copiado"); return; }
  if (a === "wa" && p){ window.open(`https://wa.me/${p.tel}?text=${encodeURIComponent($("#msg").value)}`, "_blank", "noopener"); return; }
  if (a === "mail" && p){ window.open(outlookMail(p.email, $("#msg").value), "_blank", "noopener"); return; }
  if (a === "guardar" && p){
    const et = $("#etapa").value, d = fromIso($("#prox").value), hora = $("#hora").value, nota = $("#nota").value.trim();
    const ch = {}, logs = [];
    if (et !== (p.etapa || "")){ ch.etapa = et; logs.push(`Pasó a ${et}`); }
    if (iso(d) !== iso(p.prox)){ ch.prox = d; if (d) logs.push(`Próximo paso: ${et === "Reunión" && hora ? `Reunión el ${fd(d)} ${hora}` : (ACCION[et] || "Hacer seguimiento") + (hora ? ` (${hora})` : "")}`); }
    else if (hora && d){ logs.push(`Próximo paso: ${et === "Reunión" ? `Reunión el ${fd(d)} ${hora}` : (ACCION[et] || "Hacer seguimiento") + ` (${hora})`}`); }
    if (nota){ logs.push(nota); ch.ult = today; }
    if (!Object.keys(ch).length && !logs.length){ toast("No hay cambios para guardar"); return; }
    if (logs.length) ch.notas = logs.reverse().map(l => `${fd(today)}: ${l}`).join("\n") + (p.notas ? "\n" + p.notas : "");
    await saveFields("c", p, ch); refresh("Cambios guardados"); return;
  }
  if (a === "pot-edit"){ const q = get(+t.dataset.pid); if (q){ $("#layer").insertAdjacentHTML("beforeend", modalContacto(q)); } return; }
  if (a === "pot-hoy"){ const q = get(+t.dataset.pid); if (q){ await saveFields("c", q, { prox: today, notas: logLine(q, "Próximo paso: Primer contacto") }); refresh(`${q.empresa} pasó a tu lista de hoy`); } return; }
  if (a === "linkedin"){ LI.err = ""; showLI(); return; }
  if (a === "li-read"){ leerCapturas(); return; }
  if (a === "li-reset"){ LI.res = null; LI.imgs = []; showLI(); return; }
  if (a === "li-add"){ agregarLI(); return; }
  if (a === "lista-sin"){ closeModal(); const sin = sinPaso(); $("#layer").insertAdjacentHTML("beforeend", modalLista("Sin próximo paso", sin, sin.length ? `<p class="hint" style="margin:0">Empresas activas sin fecha. Con un clic les armo fecha y qué hacer a todas.</p><p style="margin:0"><button class="btn primary sm" data-act="plan">Armar próximos pasos</button></p>` : "")); return; }
  if (a === "lista-rev"){ $("#layer").insertAdjacentHTML("beforeend", modalLista("Datos para completar", S.P.filter(p => p.revisar), `<p class="hint" style="margin:0">Abrí cada una, tocá “Editar datos” y corregí lo que falta.</p>`)); return; }
  if (a === "lista-hoy"){ const act = enSeguimiento(); const L = [...act.filter(p => p.prox && diff(p.prox) < 0).sort((a,b) => a.prox - b.prox), ...act.filter(p => p.prox && diff(p.prox) === 0)]; $("#layer").insertAdjacentHTML("beforeend", modalLista("Para hacer hoy", L, L.length ? `<p class="hint" style="margin:0">Primero los atrasados (en rojo). Tocá cada empresa para ver el mensaje y los botones.</p>` : "")); return; }
  if (a === "lista-prueba"){ $("#layer").insertAdjacentHTML("beforeend", modalLista("Probando gratis", S.P.filter(p => p.etapa === "Prueba gratis"))); return; }
  if (a === "wkprev"){ S.wk = Math.max(0, (S.wk || 0) - 1); render(); return; }
  if (a === "wknext"){ S.wk = (S.wk || 0) + 1; render(); return; }
  if (a === "wkhoy"){ S.wk = 0; render(); return; }
  if (a === "lista-cob"){ $("#layer").insertAdjacentHTML("beforeend", modalCobros()); return; }
  if (a === "calprev" || a === "calnext"){ const m = S.cal || new Date(today.getFullYear(), today.getMonth(), 1); S.cal = new Date(m.getFullYear(), m.getMonth() + (a === "calnext" ? 1 : -1), 1); render(); return; }
  if (a === "caltoday"){ S.cal = null; render(); return; }
  if (a === "dia"){ const k = t.dataset.dia; $("#layer").insertAdjacentHTML("beforeend", modalLista(capWord(fromIso(k).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})), enSeguimiento().filter(p => p.prox && iso(p.prox) === k))); return; }
  if (a === "plan"){ closeModal(); $("#layer").insertAdjacentHTML("beforeend", modalPlan()); return; }
  if (a === "outlook" && p){
    const day = $("#prox").value || iso(nextBiz(today)), hora = $("#hora").value || "10:00";
    window.open(outlookEvent(`Seguimiento ${p.empresa} – ${p.contacto}`, day, hora, fichaTxt(p, (proxPaso(p) ? "Próximo paso: " + proxPaso(p) + "\n\n" : "") + $("#msg").value)), "_blank", "noopener");
    await saveFields("c", p, { prox: fromIso(day) }); refresh(`Agendado para el ${fd(fromIso(day))}`); return;
  }
  if (a === "saveprox" && p){ const d = fromIso($("#prox").value); await saveFields("c", p, { prox: d }); refresh(d ? `Próximo seguimiento: ${fd(d)}` : "Sin fecha de seguimiento"); return; }
  if (a === "addnota" && p){ const v = $("#nota").value.trim(); if (!v) return; await saveFields("c", p, { notas: logLine(p, v), ult: today }); refresh("Nota agregada"); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".card[data-open]")) openP(+e.target.dataset.open);
  if (e.key === "Escape"){ if (document.querySelector("#layer .modal")) closeModal(); else { S.openId = null; $("#layer").innerHTML = ""; } }
});
document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target, num = id => { const v = $(id).value; return v === "" ? null : +v; };
  const btn = f.querySelector('[type="submit"]'); btn.setAttribute("aria-disabled", "true");
  if (f.id === "fventa"){
    const pr = $("#v-tipo").value === "Prueba";
    const data = { tipo: pr ? "Prueba" : "Venta", empresa: $("#v-emp").value.trim(), fecha: fromIso($("#v-fecha").value), creditos: num("#v-cred"), vendido: pr ? null : num("#v-vend"), cobro: pr ? false : $("#v-cobro").checked, fcobro: pr ? null : fromIso($("#v-fcobro").value), neto: pr ? null : num("#v-neto"), iibb: pr ? null : num("#v-iibb"), notas: $("#v-not").value.trim() };
    if (f.dataset.id) await saveFields("v", S.V.find(v => v.id === +f.dataset.id), data); else await appendRow("v", data);
    closeModal(); refresh(pr ? "Prueba guardada" : "Venta guardada");
  }
  if (f.id === "freunion"){
    const p = get(+f.dataset.id), day = $("#r-dia").value, hora = $("#r-hora").value || "10:00", d = fromIso(day);
    if (ev.submitter && ev.submitter.dataset.cal) window.open(outlookEvent(`Reunión PotenciaIA – ${p.empresa}`, day, hora, fichaTxt(p, "")), "_blank", "noopener");
    await saveFields("c", p, { etapa: "Reunión", prox: d, ult: today, veces: (p.veces || 0) + 1, notas: logLine(p, `Agendamos reunión para el ${fd(d)} a las ${hora}. Próximo paso: Reunión el ${fd(d)} ${hora}`) });
    closeModal(); refresh(`Reunión guardada para el ${fd(d)}`);
  }
  if (f.id === "fotro"){
    const p = get(+f.dataset.id), txt = $("#o-txt").value.trim(), c = $("#o-cuando").value, et = $("#o-etapa").value;
    const d = c === "fecha" ? fromIso($("#o-fecha").value) : c ? addDays(+c) : null;
    const logs = [txt]; if (et !== p.etapa) logs.push(`Pasó a ${et}`); if (d) logs.push(`Próximo paso: Retomar: ${txt.length > 60 ? txt.slice(0, 57) + "…" : txt}`);
    await saveFields("c", p, { ult: today, veces: (p.veces || 0) + 1, prox: d, etapa: et, notas: logs.reverse().map(l => `${fd(today)}: ${l}`).join("\n") + (p.notas ? "\n" + p.notas : "") });
    closeModal(); refresh(d ? `Guardado. Te lo recuerdo el ${fd(d)}` : "Guardado");
    return;
  }
  if (f.id === "fplan"){
    const items = [...f.querySelectorAll("input[data-pid]")].filter(i => i.value).map(i => { const p = get(+i.dataset.pid); return [p, { prox: fromIso(i.value), notas: logLine(p, "Próximo paso: " + i.dataset.acc) }]; });
    await saveMany("c", items); closeModal(); refresh(`Listo: ${items.length} próximos pasos con fecha`);
  }
  if (f.id === "fpot"){
    const nota = $("#pt-not").value.trim(); S.lastOri = $("#pt-ori").value;
    const rec = { empresa: $("#pt-emp").value.trim(), contacto: $("#pt-con").value.trim(), cargo: $("#pt-car").value.trim(), tel: "", email: "", li: $("#pt-li").value.trim(), etapa: POT, origen: S.lastOri, canal: "", veces: 0, ult: null, prox: null, notas: `${fd(today)}: Agregado a outbound` + (nota ? `\n${fd(today)}: ${nota}` : ""), revisar: "" };
    if (await appendRows([rec])){ render(); toast(`${rec.empresa} agregada a Outbound`); const e = $("#pt-emp"); if (e) e.focus(); }
    return;
  }
  if (f.id === "fcontacto"){
    const data = { empresa: $("#n-emp").value.trim(), contacto: $("#n-con").value.trim(), cargo: $("#n-car").value.trim(), tel: toTel($("#n-tel").value), email: $("#n-mail").value.trim(), li: $("#n-li").value.trim(), origen: $("#n-ori").value, canal: $("#n-can").value };
    if (f.dataset.id){ const ok = $("#n-ok"); if (ok && ok.checked) data.revisar = "";
      const q0 = get(+f.dataset.id), et = $("#n-et").value; if (et !== (q0.etapa || POT)){ data.etapa = et; data.notas = logLine(q0, `Pasó a ${et}`); if (et !== POT && !q0.prox && et !== "Perdido") data.prox = nextBiz(today); } await saveFields("c", get(+f.dataset.id), data); closeModal(); refresh("Datos guardados"); }
    else {
      const nota = $("#n-not").value.trim();
      const px = fromIso($("#n-prox").value);
      Object.assign(data, { etapa: POT, veces: 0, ult: null, prox: px, notas: (px ? `${fd(today)}: Próximo paso: Primer contacto\n` : "") + `${fd(today)}: Contacto creado` + (nota ? `\n${fd(today)}: ${nota}` : ""), revisar: "" });
      const ok = await appendRows([data]); $("#layer").innerHTML = ""; render();
      if (ok){ const rec = S.P.find(x => x.contacto === data.contacto && x.empresa === data.empresa); if (rec) openP(rec.id); toast(px ? `Contacto creado. Te lo agendé para el ${fd(px)}` : "Contacto creado en Outbound"); }
    }
  }
});
/* Tooltip */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el){ tip.hidden = true; return; }
  const s = el.getAttribute("data-tip"); if (el.dataset.html) tip.innerHTML = s; else tip.textContent = s;
  tip.hidden = false; const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, e.clientX + 14) + "px";
  tip.style.top = Math.max(8, e.clientY - r.height - 12) + "px";
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.mode === "live" && S.token && !document.querySelector("#layer .modal")) loadLive(true); });

/* ===================== ARRANQUE ===================== */
if (!CONFIG.CLIENT_ID || CONFIG.CLIENT_ID.includes("PEGAR")) startDemo();
else startLive();
</script>
</body>
